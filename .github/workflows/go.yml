name: Go
on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # 版本取自 go.mod，避免升级 Go 时出现两份需要同步的版本号。
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 依赖真实 pixiv 的测试默认自行跳过（见 testenv.RequireLive），
      # 因此这里跑到的只是不依赖外部网络的部分，结果不受运行机器网络环境影响。
      - name: Test
        run: make test
